name: Build and Deploy

on:
  push:
    branches:
      - claude/dazzling-albattani-moc901
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 发布到 gh-pages 分支：只需要 contents:write，GITHUB_TOKEN 即可。
      # 公开仓库推送 gh-pages 分支通常会自动启用 Pages；
      # 若未自动启用，在 Settings → Pages 选择 "Deploy from a branch: gh-pages" 一次即可。
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
